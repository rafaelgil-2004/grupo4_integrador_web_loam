<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | Convenios UNLPam</title>
    <link rel="stylesheet" href="../recursos/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header id="navbar"></header>

    <main class="container py-4 flex-grow-1">
        <button type="button" class="btn btn-link ps-0 mb-2" id="botonVolver">← Volver</button>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="h3 titulo mb-0">Usuarios</h1>
            <button type="button" class="btn btn-principal" id="botonNuevo">Nuevo usuario</button>
        </div>

        <div id="alertas" aria-live="polite"></div>

        <form id="formularioFiltros" class="card card-body mb-4" novalidate>
            <div class="row g-3">
                <div class="col-md-6 col-lg-5">
                    <label for="q" class="form-label">Buscar</label>
                    <input type="search" class="form-control" id="q" name="q" placeholder="Nombre, apellido o mail">
                </div>
                <div class="col-md-3 col-lg-3">
                    <label for="filtroRol" class="form-label">Rol</label>
                    <select class="form-select" id="filtroRol" name="rol">
                        <option value="">Todos</option>
                        <option value="ADMINISTRACION">Administración</option>
                        <option value="GESTION">Gestión</option>
                        <option value="ESTUDIANTE">Estudiante</option>
                        <option value="PROFESOR">Profesor</option>
                        <option value="DECANO">Decano</option>
                    </select>
                </div>
                <div class="col-md-3 col-lg-2">
                    <label for="filtroEstado" class="form-label">Estado</label>
                    <select class="form-select" id="filtroEstado" name="estado">
                        <option value="">Todos</option>
                        <option value="activos">Activos</option>
                        <option value="inactivos">Inactivos</option>
                    </select>
                </div>
            </div>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-principal">Buscar</button>
                <button type="button" class="btn btn-outline-secondary" id="botonLimpiar">Limpiar</button>
            </div>
        </form>

        <section aria-labelledby="titulo-resultados" id="resultados" aria-busy="false">
            <h2 class="h5 titulo mb-2" id="titulo-resultados">
                Resultados <span class="fw-normal text-body-secondary" id="resumenResultados"></span>
            </h2>

            <div id="cargando" class="d-none text-center py-4">
                <div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div>
            </div>

            <p id="sinResultados" class="d-none text-body-secondary py-3">No se encontraron usuarios con esos filtros.</p>

            <div class="table-responsive" id="contenedorTabla">
                <table class="table table-hover align-middle">
                    <caption class="visually-hidden">Listado de usuarios</caption>
                    <thead>
                        <tr>
                            <th scope="col">Apellido y nombre</th>
                            <th scope="col">Mail</th>
                            <th scope="col">Rol</th>
                            <th scope="col">Unidad</th>
                            <th scope="col">Estado</th>
                            <th scope="col"><span class="visually-hidden">Acciones</span></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Alta y edición: un solo formulario que sirve para los dos casos -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-labelledby="tituloModalUsuario" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="formularioUsuario" novalidate autocomplete="off">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="tituloModalUsuario">Nuevo usuario</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="errorModalUsuario" aria-live="polite"></div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre <span class="text-danger" aria-hidden="true">*</span></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" maxlength="60" required>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="apellido" class="form-label">Apellido <span class="text-danger" aria-hidden="true">*</span></label>
                            <input type="text" class="form-control" id="apellido" name="apellido" maxlength="60" required>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-12">
                            <label for="mail" class="form-label">Mail <span class="text-danger" aria-hidden="true">*</span></label>
                            <input type="email" class="form-control" id="mail" name="mail" maxlength="120" required>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="rol" class="form-label">Rol <span class="text-danger" aria-hidden="true">*</span></label>
                            <select class="form-select" id="rol" name="rol" required>
                                <option value="">Seleccionar...</option>
                                <option value="ADMINISTRACION">Administración</option>
                                <option value="GESTION">Gestión</option>
                                <option value="ESTUDIANTE">Estudiante</option>
                                <option value="PROFESOR">Profesor</option>
                                <option value="DECANO">Decano</option>
                            </select>
                            <div class="invalid-feedback"></div>
                            <div class="form-text d-none" id="avisoRolPropio">No puede cambiar su propio rol.</div>
                        </div>
                        <div class="col-md-6" id="grupoUnidad">
                            <label for="unidadId" class="form-label">
                                Unidad <span class="text-danger d-none" id="marcaUnidad" aria-hidden="true">*</span>
                            </label>
                            <select class="form-select" id="unidadId" name="unidadId">
                                <option value="">Sin unidad</option>
                            </select>
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="col-12">
                            <label for="password" class="form-label">
                                Contraseña <span class="text-danger d-none" id="marcaPassword" aria-hidden="true">*</span>
                            </label>
                            <input type="password" class="form-control" id="password" name="password"
                                   minlength="8" maxlength="72" autocomplete="new-password">
                            <div class="invalid-feedback"></div>
                            <div class="form-text" id="ayudaPassword"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-principal" id="botonGuardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmación para desactivar -->
    <div class="modal fade" id="modalDesactivar" tabindex="-1" aria-labelledby="tituloModalDesactivar" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="tituloModalDesactivar">Desactivar usuario</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p id="textoModalDesactivar"></p>
                    <div id="errorModalDesactivar" aria-live="polite"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="botonConfirmarDesactivar">Desactivar</button>
                </div>
            </div>
        </div>
    </div>

    <footer id="pie" class="pie"></footer>

    <script src="../recursos/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/paginas/usuarios.js"></script>
</body>
</html>
