<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | Convenios UNLPam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../recursos/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/comun.css">
    <link rel="stylesheet" href="../css/usuarios.css">
</head>
<body class="pagina-sitio">
    <header id="navbar"></header>

    <main class="contenedor-usuarios">
        <div class="cabecera-pagina">
            <div>
                <h1 class="titulo">Usuarios</h1>
                <p>Consultá las personas registradas y administrá sus niveles de acceso.</p>
            </div>
        </div>

        <div id="alertas" aria-live="polite"></div>

        <form id="formularioBusqueda" novalidate>
            <div class="barra-busqueda">
                <label for="q" class="visually-hidden">Buscar por nombre, apellido o email</label>
                <input type="search" class="form-control" id="q" name="q" autocomplete="off"
                       placeholder="Buscar por nombre, apellido o email">
                <button type="submit" class="btn btn-convenios">Buscar</button>
            </div>

            <div class="barra-acciones">
                <!-- El único filtro es el rol -->
                <div class="dropdown">
                    <button type="button" class="btn btn-borde btn-chico" id="botonFiltroRol" data-bs-toggle="dropdown"
                            aria-expanded="false">
                        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
                        <span id="textoFiltroRol">Filtrar por rol</span>
                    </button>
                    <ul class="dropdown-menu" id="menuRoles"></ul>
                </div>
                <a class="btn btn-convenios btn-chico" href="usuario-form.html">Registrar usuario</a>
            </div>
        </form>

        <section aria-labelledby="titulo-resultados" id="resultados" aria-busy="false">
            <h2 class="visually-hidden" id="titulo-resultados">Resultados</h2>
            <div class="linea-resultados">
                <span id="cantidadUsuarios" role="status"></span>
            </div>

            <div id="cargando" class="d-none text-center py-4">
                <div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div>
            </div>

            <div class="table-responsive tabla-usuarios" id="contenedorTabla">
                <table>
                    <caption class="visually-hidden">Listado de usuarios</caption>
                    <thead>
                        <tr>
                            <th scope="col">Nombre y apellido</th>
                            <th scope="col">Rol</th>
                            <th scope="col">Email</th>
                            <th scope="col">Estado</th>
                            <th scope="col"><span class="visually-hidden">Acciones</span></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>
            <p id="sinResultados" class="d-none py-3">No se encontraron usuarios.</p>
        </section>
    </main>


    <!-- Confirmación de activar / desactivar -->
    <div class="modal fade modal-confirmar" id="modalActivo" tabindex="-1" aria-labelledby="tituloModalActivo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <h2 id="tituloModalActivo"></h2>
                <p id="textoModalActivo"></p>
                <div class="acciones-modal">
                    <button type="button" class="btn btn-borde btn-chico" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-convenios btn-chico" id="confirmarActivo">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <footer id="pie"></footer>

    <script src="../recursos/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/paginas/usuarios.js"></script>
</body>
</html>
