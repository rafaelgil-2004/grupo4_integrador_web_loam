<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio | Convenios UNLPam</title>
    <link rel="stylesheet" href="../recursos/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header id="navbar"></header>

    <main class="container py-4">
        <div id="alertas"></div>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="h3 titulo mb-0">Inicio</h1>
                <p class="mb-0" id="saludo"></p>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-principal" href="convenio-form.html">Nuevo convenio</a>
                <a class="btn btn-outline-secondary" href="convenios.html?vista=arbol">Ver árbol</a>
            </div>
        </div>

        <section aria-labelledby="titulo-resumen">
            <h2 class="visually-hidden" id="titulo-resumen">Resumen de convenios</h2>
            <div class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-3">
                <div class="col">
                    <a class="card tarjeta-resumen" href="convenios.html?estado=FIRMADO">
                        <div class="card-body">
                            <div class="tarjeta-numero" id="num-firmados">—</div>
                            <div>Firmados en el último año</div>
                        </div>
                    </a>
                </div>
                <div class="col">
                    <a class="card tarjeta-resumen" href="convenios.html?vigencia=VIGENTE">
                        <div class="card-body">
                            <div class="tarjeta-numero" id="num-vigentes">—</div>
                            <div>Vigentes</div>
                        </div>
                    </a>
                </div>
                <div class="col">
                    <div class="card tarjeta-resumen">
                        <div class="card-body">
                            <div class="tarjeta-numero" id="num-tramite">—</div>
                            <div>En trámite</div>
                        </div>
                    </div>
                </div>
                <div class="col">
                    <a class="card tarjeta-resumen" href="convenios.html?vigencia=POR_VENCER">
                        <div class="card-body">
                            <div class="tarjeta-numero" id="num-porVencer">—</div>
                            <div>Por vencer</div>
                        </div>
                    </a>
                </div>
                <div class="col">
                    <a class="card tarjeta-resumen" href="convenios.html?vigencia=EXPIRADO">
                        <div class="card-body">
                            <div class="tarjeta-numero" id="num-vencidos">—</div>
                            <div>Vencidos</div>
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <div class="row g-4 mt-1">
            <section class="col-lg-7" aria-labelledby="titulo-movimientos">
                <h2 class="h5 titulo" id="titulo-movimientos">Últimos movimientos</h2>
                <div class="list-group" id="movimientos"></div>
            </section>

            <div class="col-lg-5">
                <section class="mb-4" aria-labelledby="titulo-porvencer">
                    <h2 class="h5 titulo" id="titulo-porvencer">Próximos a vencer</h2>
                    <div class="list-group" id="porVencer"></div>
                </section>
                <section aria-labelledby="titulo-estados">
                    <h2 class="h5 titulo" id="titulo-estados">Convenios por estado</h2>
                    <div class="list-group" id="porEstado"></div>
                </section>
            </div>
        </div>
    </main>

    <footer id="pie" class="pie"></footer>

    <script src="../recursos/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/paginas/inicio.js"></script>
</body>
</html>
