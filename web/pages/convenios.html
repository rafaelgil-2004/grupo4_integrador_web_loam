<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Convenios | Convenios UNLPam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../recursos/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/comun.css">
    <link rel="stylesheet" href="../css/convenios.css">
</head>
<body class="pagina-sitio">
    <header id="navbar"></header>

    <main class="contenedor-convenios">
        <div class="cabecera-pagina">
            <div>
                <h1 class="titulo">Convenios institucionales</h1>
                <p>Consultá los convenios vigentes, sus documentos relacionados y el estado de cada firma.</p>
            </div>
        </div>

        <div id="alertas"></div>

        <!-- Contadores solo informativos (no son enlaces ni botones) -->
        <section class="resumen" aria-label="Resumen de convenios">
            <div class="dato-resumen"><strong id="num-firmados">—</strong>Firmados en el último año</div>
            <div class="dato-resumen"><strong id="num-vigentes">—</strong>Vigentes</div>
            <div class="dato-resumen"><strong id="num-tramite">—</strong>En trámite</div>
            <div class="dato-resumen"><strong id="num-porVencer">—</strong>Por vencer</div>
            <div class="dato-resumen"><strong id="num-vencidos">—</strong>Vencidos</div>
        </section>

        <form id="formularioFiltros" novalidate>
            <!-- Buscador por texto: la API busca en título y código -->
            <div class="barra-busqueda">
                <label for="q" class="visually-hidden">Buscar por nombre o código</label>
                <input type="search" class="form-control" id="q" name="q" placeholder="Buscar por nombre o código" autocomplete="off">
                <button type="submit" class="btn btn-convenios" id="botonBuscar">Buscar</button>
            </div>

            <div class="barra-acciones">
                <button type="button" class="btn btn-borde" data-bs-toggle="collapse" data-bs-target="#panelFiltros"
                        aria-expanded="false" aria-controls="panelFiltros">Filtros</button>
                <!-- Administración y Gestión crean convenios; Consulta no (el JS lo muestra) -->
                <a class="btn btn-convenios" id="botonCrear" href="convenio-form.html" hidden>Crear convenio</a>
            </div>

            <div class="collapse" id="panelFiltros">
                <div class="panel-filtros">
                    <div class="row g-3">
                        <div class="col-6 col-md-3">
                            <label for="tipo" class="form-label">Tipo</label>
                            <select class="form-select" id="tipo" name="tipo">
                                <option value="">Todos</option>
                                <option value="MARCO">Marco</option>
                                <option value="ESPECIFICO">Específico</option>
                                <option value="ADENDA">Adenda</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="subtipo" class="form-label">Subtipo</label>
                            <select class="form-select" id="subtipo" name="subtipo">
                                <option value="">Todos</option>
                                <option value="COLABORACION">Colaboración</option>
                                <option value="PASANTIA">Pasantía</option>
                                <option value="PRACTICA">Práctica profesional</option>
                                <option value="INTERCAMBIO">Intercambio</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" name="estado">
                                <option value="">Todos</option>
                                <option value="BORRADOR">Borrador</option>
                                <option value="ACEPTADO">Aceptado (pendiente de firmas)</option>
                                <option value="FIRMADO">Firmado</option>
                                <option value="RESCINDIDO">Rescindido</option>
                                <option value="ARCHIVADO">Archivado</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="vigencia" class="form-label">Vigencia</label>
                            <select class="form-select" id="vigencia" name="vigencia">
                                <option value="">Todas</option>
                                <option value="VIGENTE">Vigentes (incluye por vencer)</option>
                                <option value="POR_VENCER">Por vencer</option>
                                <option value="EXPIRADO">Vencidos</option>
                            </select>
                        </div>
                        <div class="col-6 col-md-3">
                            <label for="anioFirma" class="form-label">Año de firma</label>
                            <input type="number" class="form-control" id="anioFirma" name="anioFirma" min="2000" max="2100">
                        </div>
                        <!-- Solo Administración (el JS lo elimina para Gestión y Consulta) -->
                        <div class="col-6 col-md-4" id="campoUnidad">
                            <label for="unidadId" class="form-label">Unidad</label>
                            <select class="form-select" id="unidadId" name="unidadId">
                                <option value="">Todas</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-3 d-flex align-items-end">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="incluirArchivados" name="incluirArchivados">
                                <label class="form-check-label" for="incluirArchivados">Incluir archivados</label>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-convenios btn-chico">Aplicar filtros</button>
                        <button type="button" class="btn btn-borde btn-chico" id="botonLimpiar">Limpiar</button>
                    </div>
                </div>
            </div>
        </form>

        <section aria-labelledby="titulo-resultados" id="resultados" aria-busy="false">
            <h2 class="visually-hidden" id="titulo-resultados">Resultados</h2>
            <div class="linea-resultados">
                <span id="resumenResultados" role="status"></span>
                <span id="actualizado"></span>
            </div>
            <div id="cargando" class="d-none text-center py-4">
                <div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div>
            </div>
            <p id="sinResultados" class="d-none py-3">No se encontraron convenios con esos filtros.</p>
            <div id="arbol"></div>
            <nav id="paginacion" aria-label="Páginas de convenios"></nav>
        </section>
    </main>

    <footer id="pie"></footer>

    <script src="../recursos/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/paginas/convenios.js"></script>
</body>
</html>
