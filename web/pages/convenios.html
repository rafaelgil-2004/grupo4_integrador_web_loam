<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Convenios | Convenios UNLPam</title>
    <link rel="stylesheet" href="../recursos/bootstrap/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header id="navbar"></header>

    <main class="container py-4 flex-grow-1">
        <button type="button" class="btn btn-link ps-0 mb-2" id="botonVolver">← Volver</button>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h1 class="h3 titulo mb-0">Convenios</h1>
            <a class="btn btn-principal" href="convenio-form.html">Nuevo convenio</a>
        </div>

        <div id="alertas"></div>

        <form id="formularioFiltros" class="card card-body mb-4" novalidate>
            <div class="row g-3">
                <div class="col-md-6 col-lg-4">
                    <label for="q" class="form-label">Buscar</label>
                    <input type="search" class="form-control" id="q" name="q" placeholder="Título o código">
                </div>
                <div class="col-md-3 col-lg-2">
                    <label for="tipo" class="form-label">Tipo</label>
                    <select class="form-select" id="tipo" name="tipo">
                        <option value="">Todos</option>
                        <option value="MARCO">Marco</option>
                        <option value="ESPECIFICO">Específico</option>
                        <option value="ADENDA">Adenda</option>
                    </select>
                </div>
                <div class="col-md-3 col-lg-3">
                    <label for="subtipo" class="form-label">Subtipo</label>
                    <select class="form-select" id="subtipo" name="subtipo">
                        <option value="">Todos</option>
                        <option value="COLABORACION">Colaboración</option>
                        <option value="PASANTIA">Pasantía</option>
                        <option value="PRACTICA">Práctica profesional</option>
                        <option value="INTERCAMBIO">Intercambio</option>
                    </select>
                </div>
                <div class="col-md-3 col-lg-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-select" id="estado" name="estado">
                        <option value="">Todos</option>
                        <option value="BORRADOR">Borrador</option>
                        <option value="ACEPTADO">Aceptado</option>
                        <option value="FIRMADO">Firmado</option>
                        <option value="RESCINDIDO">Rescindido</option>
                        <option value="ARCHIVADO">Archivado</option>
                    </select>
                </div>
                <div class="col-md-3 col-lg-3">
                    <label for="vigencia" class="form-label">Vigencia</label>
                    <select class="form-select" id="vigencia" name="vigencia">
                        <option value="">Todas</option>
                        <option value="VIGENTE">Vigentes (incluye por vencer)</option>
                        <option value="POR_VENCER">Por vencer</option>
                        <option value="EXPIRADO">Vencidos</option>
                    </select>
                </div>
                <div class="col-md-3 col-lg-2">
                    <label for="anioFirma" class="form-label">Año de firma</label>
                    <input type="number" class="form-control" id="anioFirma" name="anioFirma" min="2000" max="2100">
                </div>
                <!-- Solo se muestra a Administración (el JS lo elimina para Gestión) -->
                <div class="col-md-6 col-lg-4" id="campoUnidad">
                    <label for="unidadId" class="form-label">Unidad</label>
                    <select class="form-select" id="unidadId" name="unidadId">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="col-lg-3 d-flex align-items-end">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="incluirArchivados" name="incluirArchivados">
                        <label class="form-check-label" for="incluirArchivados">Incluir archivados</label>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-principal">Buscar</button>
                <button type="button" class="btn btn-outline-secondary" id="botonLimpiar">Limpiar</button>
            </div>
        </form>

        <section aria-labelledby="titulo-resultados" id="resultados" aria-busy="false">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                <h2 class="h5 titulo mb-0" id="titulo-resultados">
                    Resultados <span class="fw-normal text-body-secondary" id="resumenResultados"></span>
                </h2>
                <div class="btn-group" role="group" aria-label="Forma de mostrar los resultados">
                    <button type="button" class="btn btn-outline-secondary" id="vistaTabla" aria-pressed="true">Tabla</button>
                    <button type="button" class="btn btn-outline-secondary" id="vistaArbol" aria-pressed="false">Árbol</button>
                </div>
            </div>

            <div id="cargando" class="d-none text-center py-4">
                <div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div>
            </div>

            <p id="sinResultados" class="d-none text-body-secondary py-3">No se encontraron convenios con esos filtros.</p>

            <div id="contenedorTabla">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <caption class="visually-hidden">Listado de convenios</caption>
                        <thead>
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Título</th>
                                <th scope="col">Tipo</th>
                                <th scope="col">Unidad</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Vencimiento</th>
                                <th scope="col"><span class="visually-hidden">Acciones</span></th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla"></tbody>
                    </table>
                </div>
                <nav id="paginacion" class="mt-3" aria-label="Paginación de resultados"></nav>
            </div>

            <div id="contenedorArbol" class="d-none">
                <ul class="arbol-raiz" id="arbol"></ul>
            </div>
        </section>
    </main>

    <footer id="pie" class="pie"></footer>

    <script src="../recursos/bootstrap/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/paginas/convenios.js"></script>
</body>
</html>
